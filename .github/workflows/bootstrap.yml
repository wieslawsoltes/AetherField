name: Import and verify AetherField source

on:
  push:
    branches: [main]
    paths: ['.bootstrap/manifest.json']

permissions:
  contents: write

concurrency:
  group: aetherfield-source-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore the exact source files and verify SHA-256 checksums
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          import {brotliDecompressSync} from 'node:zlib';
          const manifest=JSON.parse(fs.readFileSync('.bootstrap/manifest.json','utf8'));
          if(manifest.format!=='aetherfield-source-brotli-json-v1')throw Error('Unsupported source archive');
          const hash=b=>crypto.createHash('sha256').update(b).digest('hex');
          const parts=manifest.parts.map(name=>{
            if(!/^part-\d{3}\.brpart$/.test(name))throw Error('Invalid archive part');
            return fs.readFileSync(path.join('.bootstrap',name));
          });
          const packed=Buffer.concat(parts);
          if(hash(packed)!==manifest.sha256)throw Error('Archive checksum mismatch');
          const files=JSON.parse(brotliDecompressSync(packed).toString('utf8'));
          if(Object.keys(files).length!==Object.keys(manifest.files).length)throw Error('File count mismatch');
          for(const [name,text] of Object.entries(files)){
            if(path.isAbsolute(name)||name.split('/').some(s=>s==='..'||s==='')||name.startsWith('.git/')||name.startsWith('.github/')||name.startsWith('.bootstrap/'))throw Error('Unsafe source path');
            if(typeof text!=='string'||hash(Buffer.from(text))!==manifest.files[name])throw Error(`Source checksum mismatch: ${name}`);
            fs.mkdirSync(path.dirname(name),{recursive:true});fs.writeFileSync(name,text);
          }
          console.log(`Verified and restored ${Object.keys(files).length} original source files.`);
          NODE
      - name: Run the numerical suite and rebuild the standalone application
        run: |
          npm test
          npm run build:standalone
          npm run examples
      - name: Install the browser test runner
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Run all browser workflows and generate actual result screenshots
        run: |
          CHROMIUM="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          python tests/browser.py --chromium "$CHROMIUM"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const n=JSON.parse(fs.readFileSync('tests/results.json','utf8'));
          const b=JSON.parse(fs.readFileSync('tests/browser-results.json','utf8'));
          assert.equal(n.passed,16);assert.equal(n.total,16);
          assert.equal(b.passed,11);assert.equal(b.total,11);assert.equal(b.pageErrors.length,0);
          console.log('Verified: 16 numerical tests and 11 browser integration tests.');
          NODE
      - name: Record checksums and commit the complete readable application
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('.')
          files={p.as_posix():hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(root.rglob('*')) if p.is_file() and not any(s in {'.git','.github','.bootstrap','__pycache__','node_modules'} for s in p.parts) and p.name!='SHA256SUMS.json'}
          Path('SHA256SUMS.json').write_text(json.dumps(files,indent=2)+'\n')
          PY
          git rm -r .bootstrap
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m 'Import complete AetherField application with verified numerical and browser results'
          git push origin HEAD:main
