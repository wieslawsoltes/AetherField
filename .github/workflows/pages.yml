name: Verify and deploy AetherField

on:
  push:
    branches: [main, gh-pages]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aetherfield-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Numerical and browser verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    outputs:
      deploy: ${{ steps.pages.outputs.deploy }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run numerical benchmarks and build distributions
        run: |
          npm test
          npm run build:standalone
          npm run examples
      - name: Install browser test runner
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Verify all browser workflows and result exports
        run: |
          CHROMIUM="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          python tests/browser.py --chromium "$CHROMIUM"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const n=JSON.parse(fs.readFileSync('tests/results.json','utf8'));
          const b=JSON.parse(fs.readFileSync('tests/browser-results.json','utf8'));
          assert.equal(n.passed,16);assert.equal(n.total,16);
          assert.equal(b.passed,11);assert.equal(b.total,11);assert.equal(b.pageErrors.length,0);
          console.log('Verified: 16 numerical tests and 11 browser integration tests.');
          NODE
      - name: Read Pages configuration and select publication branch
        id: pages
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/pages" > "$RUNNER_TEMP/aetherfield-pages.json"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const site=JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/aetherfield-pages.json`,'utf8'));
          console.log(JSON.stringify({build_type:site.build_type,source:site.source,url:site.html_url},null,2));
          const branch=site.build_type==='workflow'?'main':site.source?.branch;
          if(!branch)throw Error('GitHub Pages has no configured publication branch');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`deploy=${process.env.GITHUB_REF===`refs/heads/${branch}`}\n`);
          NODE
      - name: Stage the verified static application
        if: steps.pages.outputs.deploy == 'true'
        run: |
          mkdir -p _site
          cp index.html styles.css app.js AetherField-standalone.html LICENSE README.md _site/
          cp -R core view examples docs tests _site/
          touch _site/.nojekyll
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import path from 'node:path';
          const p=JSON.parse(fs.readFileSync('package.json','utf8'));
          fs.writeFileSync('_site/build.json',JSON.stringify({name:'AetherField',version:p.version,commit:process.env.GITHUB_SHA,branch:process.env.GITHUB_REF_NAME,run:process.env.GITHUB_RUN_ID,numericalTests:16,browserTests:11,builtAt:new Date().toISOString()},null,2)+'\n');
          const checksums={};
          function visit(dir){for(const e of fs.readdirSync(dir,{withFileTypes:true})){const f=path.join(dir,e.name);if(e.isDirectory())visit(f);else checksums[path.relative('_site',f)]=crypto.createHash('sha256').update(fs.readFileSync(f)).digest('hex');}}
          visit('_site');fs.writeFileSync('_site/SHA256SUMS.json',JSON.stringify(checksums,null,2)+'\n');
          NODE
      - name: Upload verified Pages artifact
        if: steps.pages.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Publish GitHub Pages
    needs: verify
    if: needs.verify.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
